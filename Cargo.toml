[package]
name = "canna-mod-manager"
version = "0.2.43"
edition = "2024"
default-run = "canna-mod-manager"

[dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json", "multipart"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
anyhow = "1"
rfd = "0.17.2"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
sha1 = "0.10"
scraper = "0.24"
zeroize = "1"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }

[profile.release]
opt-level = 2
strip = true



[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
