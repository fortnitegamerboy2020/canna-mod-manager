<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Canna Mod Review</title><link rel="stylesheet" href="/forum.css"><link rel="icon" type="image/png" href="/favicon.png"></head><body class="reviewpage"><main><header class="siteheader"><div><h1>Mod review</h1><p id="modname"></p></div><div class="row"><a href="/">Community</a><button id="rescan">Run analysis again</button><button id="approve" class="primary" disabled>Approve with dependencies</button></div></header><p id="reviewstatus" role="status"></p><p>Static analysis flags behavior for review; it cannot prove a mod safe. Decompiled code is reconstructed source. Native or unsupported files and analysis limits are identified explicitly.</p><p id="engines"></p><div class="reviewworkspace"><aside class="reviewfiles"><label for="filesearch">Search project paths or code</label><input id="filesearch" type="search"><p id="filecount"></p><div id="filetree"></div><details><summary>Archive inventory</summary><div id="inventory"></div></details></aside><section class="reviewcode"><div class="paneltitle"><h2 id="filename">Choose a file</h2><small id="filekind"></small></div><div id="code" tabindex="0" aria-label="Source code"></div><section class="reviewfindings"><h2>Findings</h2><label for="findingfilter">Show</label><select id="findingfilter"><option value="open">Unresolved</option><option value="all">All findings</option><option value="accepted">Accepted findings</option></select><div id="findings"></div></section></section></div></main><dialog id="findingdecision"><h2 id="decisiontitle">Review finding</h2><p id="decisionevidence"></p><form id="decisionform"><label for="decisionreason">Why is this acceptable, or why should it be reopened?</label><textarea id="decisionreason" minlength="5" maxlength="500" rows="4" required></textarea><div class="row"><button id="decisioncancel" type="button">Cancel</butto
